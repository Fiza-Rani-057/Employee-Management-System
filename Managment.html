<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Managment System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Managment.css">
</head>

<body>
    <div class="container">
        <header>
            <h1> <i class="fas fa-users user"></i>Employee Managment System</h1>
            <div class="header-controles">
                <button id="add-employee-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Employee
                </button>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search Employee">
                    <button id="search-btn" class=" btn btn-search">
                        <i class="fas fa-search"></i></button>
                </div>
            </div>
        </header>
        <div class="content">
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li class="active" data-section="dashboard"> <i class="fas fa-tachometer-alt"></i>Dashboard</li>
                        <li data-section="employees"> <i class="fas fa-users"></i>Employees</li>
                        <li data-section="departments"> <i class="fas fa-building"></i>Departments</li>
                        <li data-section="positions"> <i class="fas fa-briefcase"></i>Attendance</li>
                        <li data-section="salaries"> <i class="fas fa-money-bill-wave"></i>Payroll</li>
                        <li data-section="leaves"><i class="fas fa-calendar-minus"></i>Leave</li>
                        <li data-section="reports"><i class="fas fa-file-alt"></i> Reports</li>
                        <li data-section="calender"> <i class="fa-regular fa-calendar"></i>Calender</li>
                        <li data-section="performance"><i class="fa-solid fa-arrow-trend-up"></i>Performance</li>
                        <li data-section="mesages"> <i class="fa-regular fa-message"></i>Messagesr</li>
                        <li data-section="calender"> <i class="fa-regular fa-bell"></i>Notifications</li>
                        <h3>Managment</h3>
                        <li data-section="setting"> <i class="fas fa-cog"></i>Setting</li>
                        <li data-section="profile"> <i class="fa-regular fa-user"></i>Profile</li>

                    </ul>
                </nav>
            </aside>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
