
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLYRA - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const savedTheme = localStorage.getItem("emplyraTheme");

        if (savedTheme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
</head>
<body id="body">
    <div class="auth-container">
        <div class="auth-box">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-users"></i>
                </div>
                <span>EMPLYRA</span>
            </div>

            <!-- LOGIN -->
            <div id="login-form" class="auth-form">
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to manage your employees</p>

                <form>
                    <div class="input-box">
                        <input type="email" id="email" placeholder=" " required>
                        <label>Email Address</label>
                    </div>

                    <div class="input-box">
                        <input type="password" id="password" placeholder=" " required>
                        <label>Password</label>
                        <button type="button" class="password-toggle" id="login-password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" id="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="button" id="login" class="auth-btn">
                        Login
                    </button>
                </form>

                <p class="switch-text">
                    Don't have an account?
                    <button type="button" id="show-signup">Sign Up</button>
                </p>
            </div>

            <!-- SIGN UP -->
            <div id="signup-form" class="auth-form hidden">
                <h1>Create Account</h1>
                <p class="subtitle">Start managing your employees today</p>

                <form>
                    <div class="input-box">
                        <input type="text" id="signup-name" placeholder=" " required>
                        <label>Full Name</label>
                    </div>

                    <div class="input-box">
                        <input type="email" id="signup-email" placeholder=" " required>
                        <label>Email Address</label>
                    </div>

                    <div class="input-box">
                        <input type="password" id="signup-password" placeholder=" " required>
                        <label>Password</label>
                        <button type="button" class="password-toggle" id="signup-password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-box">
                        <input type="password" id="confirm-password" placeholder=" " required>
                        <label>Confirm Password</label>
                    </div>

                    <button type="button" id="signup" class="auth-btn">
                        Create Account
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <p class="switch-text">
                    Already have an account?
                    <button type="button" id="show-login">Login</button>
                </p>
            </div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
